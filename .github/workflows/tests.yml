name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Same uv and Python as the Dockerfile, so CI tests what ships.
      - uses: astral-sh/setup-uv@v10
        with:
          version: "0.11.8"
          python-version: "3.12"
          enable-cache: true

      # --frozen: fail if uv.lock is out of date instead of silently re-resolving.
      - run: uv sync --frozen

      - run: uv run pytest -v
